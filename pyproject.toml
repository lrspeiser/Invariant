[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-theory-compiler"
version = "0.1.0"
description = "Invariant formula discovery, falsification, and formal-verification system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mpmath>=1.3,<2",
    "numpy>=2,<3",
    "sympy>=1.13,<2",
    "z3-solver>=4.15,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9", "latex2mathml==3.81.0"]
release = ["setuptools>=75", "wheel"]

[project.scripts]
sigma-compile = "sigma_theory_compiler.cli:main"
sigma-campaign = "sigma_theory_compiler.campaign_cli:main"
sigma-formula-discovery = "sigma_theory_compiler.formula_discovery_cli:main"
sigma-release = "sigma_theory_compiler.standalone_release:main"
sigma-durable-campaign = "sigma_theory_compiler.durable_two_host_campaign:main"
sigma-external-creativity = "sigma_theory_compiler.external_creativity_validation:main"
sigma-core-discovery = "sigma_theory_compiler.core_creative_discovery:main"
sigma-creativity-ablation = "sigma_theory_compiler.creativity_ablation:main"
discovery-scheduler = "sigma_theory_compiler.discovery_scheduler:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "empirical_validation: checks a measured value against a literature reference; survival is evidence, not proof",
]

[tool.ruff]
line-length = 100
target-version = "py311"
