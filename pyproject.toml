[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-theory-compiler"
version = "0.1.0"
description = "Invariant formula discovery, falsification, and formal-verification system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mpmath>=1.3,<2",
    "numpy>=2,<3",
    "sympy>=1.13,<2",
    "z3-solver>=4.15,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9", "latex2mathml==3.81.0"]
release = ["setuptools>=75", "wheel"]

[project.scripts]
sigma-compile = "sigma_theory_compiler.cli:main"
sigma-campaign = "sigma_theory_compiler.campaign_cli:main"
sigma-formula-discovery = "sigma_theory_compiler.formula_discovery_cli:main"
sigma-release = "sigma_theory_compiler.standalone_release:main"
sigma-durable-campaign = "sigma_theory_compiler.durable_two_host_campaign:main"
sigma-external-creativity = "sigma_theory_compiler.external_creativity_validation:main"
sigma-core-discovery = "sigma_theory_compiler.core_creative_discovery:main"
sigma-expanded-grammar = "sigma_theory_compiler.expanded_math_grammar_controls:main"
sigma-dataset-challenges = "sigma_theory_compiler.dataset_challenge_suite:main"
sigma-external-dataset-challenges = "sigma_theory_compiler.external_dataset_challenges:main"
sigma-external-structured-benchmarks = "sigma_theory_compiler.external_structured_benchmarks:main"
sigma-symmetry-dimension = "sigma_theory_compiler.symmetry_dimension_derivation:main"
sigma-learn-invariants = "sigma_theory_compiler.learned_invariant_discovery:main"
sigma-proof-plan-search = "sigma_theory_compiler.independent_proof_plan_search:main"
sigma-serious-claim-ladder = "sigma_theory_compiler.serious_claim_verification_ladder:main"
sigma-creativity-ablation = "sigma_theory_compiler.creativity_ablation:main"
sigma-creativity-tournament = "sigma_theory_compiler.creativity_tournament_generation:main"
sigma-creativity-confirmatory = "sigma_theory_compiler.creativity_confirmatory_generation:main"
sigma-creativity-confirmatory-recover = "sigma_theory_compiler.creativity_confirmatory_recovery:main"
sigma-creativity-confirmatory-score = "sigma_theory_compiler.creativity_confirmatory_scoring:main"
sigma-creativity-knockout-preflight = "sigma_theory_compiler.creativity_component_knockout_preflight:main"
sigma-creativity-knockout-run = "sigma_theory_compiler.creativity_component_knockout_generation:main"
sigma-prior-art = "sigma_theory_compiler.claim_specific_prior_art:main"
sigma-rotate-benchmarks = "sigma_theory_compiler.rotating_external_benchmarks:main"
discovery-scheduler = "sigma_theory_compiler.discovery_scheduler:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "empirical_validation: checks a measured value against a literature reference; survival is evidence, not proof",
]

[tool.ruff]
line-length = 100
target-version = "py311"
