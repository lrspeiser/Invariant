<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="960" height="640" viewBox="0 0 960 640">
<rect width="960" height="640" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#17212b">
<text x="40" y="40" font-size="22" text-anchor="start" font-weight="700">Figure 6. Search calibration and replication design</text>
<text x="40" y="66" font-size="12" text-anchor="start" fill="#52606d">False-selection is measured on Newtonian nulls; power is prospective and based on development effects.</text>
<text x="250" y="115" font-size="16" text-anchor="middle" font-weight="700">False-selection control</text>
<text x="710" y="115" font-size="16" text-anchor="middle" font-weight="700">Prospective replication power</text>
<line x1="100.0" y1="495" x2="400.0" y2="495" stroke="#e7ebef"/>
<text x="92" y="499" font-size="10" text-anchor="end">0%</text>
<line x1="100.0" y1="429" x2="400.0" y2="429" stroke="#e7ebef"/>
<text x="92" y="433" font-size="10" text-anchor="end">1%</text>
<line x1="100.0" y1="363" x2="400.0" y2="363" stroke="#e7ebef"/>
<text x="92" y="367" font-size="10" text-anchor="end">2%</text>
<line x1="100.0" y1="297" x2="400.0" y2="297" stroke="#e7ebef"/>
<text x="92" y="301" font-size="10" text-anchor="end">3%</text>
<line x1="100.0" y1="231" x2="400.0" y2="231" stroke="#e7ebef"/>
<text x="92" y="235" font-size="10" text-anchor="end">4%</text>
<line x1="100.0" y1="165" x2="400.0" y2="165" stroke="#e7ebef"/>
<text x="92" y="169" font-size="10" text-anchor="end">5%</text>
<rect x="200.0" y="382.207" width="100" height="112.793" fill="#087e8b"/>
<line x1="100.0" y1="165.0" x2="400.0" y2="165.0" stroke="#ff5a5f" stroke-width="2" stroke-dasharray="6 4"/>
<text x="250" y="372.207" font-size="13" text-anchor="middle" font-weight="700">1.709%</text>
<text x="250" y="530" font-size="11" text-anchor="middle">70 / 4096 null trials</text>
<text x="250" y="550" font-size="10" text-anchor="middle" fill="#52606d">red dashed line: frozen 5% threshold</text>
<line x1="570.0" y1="495" x2="850.0" y2="495" stroke="#e7ebef"/>
<text x="562" y="499" font-size="10" text-anchor="end">0%</text>
<line x1="570.0" y1="412.5" x2="850.0" y2="412.5" stroke="#e7ebef"/>
<text x="562" y="416.5" font-size="10" text-anchor="end">25%</text>
<line x1="570.0" y1="330" x2="850.0" y2="330" stroke="#e7ebef"/>
<text x="562" y="334" font-size="10" text-anchor="end">50%</text>
<line x1="570.0" y1="247.5" x2="850.0" y2="247.5" stroke="#e7ebef"/>
<text x="562" y="251.5" font-size="10" text-anchor="end">75%</text>
<line x1="570.0" y1="165" x2="850.0" y2="165" stroke="#e7ebef"/>
<text x="562" y="169" font-size="10" text-anchor="end">100%</text>
<line x1="570.0" y1="198" x2="850.0" y2="198" stroke="#ff5a5f" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="615.0" y="254.968" width="70" height="240.032" fill="#9aa5b1"/>
<text x="650" y="244.968" font-size="12" text-anchor="middle" font-weight="700">72.7%</text>
<text x="650" y="525" font-size="12" text-anchor="middle">n=120</text>
<rect x="755.0" y="198" width="70" height="297" fill="#087e8b"/>
<text x="790" y="188" font-size="12" text-anchor="middle" font-weight="700">90.0%</text>
<text x="790" y="525" font-size="12" text-anchor="middle">n=192</text>
<text x="710" y="550" font-size="10" text-anchor="middle" fill="#52606d">192 is the frozen confirmatory target</text>
<text x="480" y="607" font-size="12" text-anchor="middle" font-weight="700">Controls reduce false discovery risk; they do not create independent evidence.</text>
</g>
</svg>
