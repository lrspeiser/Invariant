[package]
name = "sigma-generator-v2"
version = "0.1.0"
edition = "2024"
description = "Deterministic billion-scale sparse-action generator for Sigma Theory Compiler"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

