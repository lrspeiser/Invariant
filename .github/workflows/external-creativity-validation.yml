name: External creativity validation

on:
  pull_request:
    paths:
      - ".github/workflows/external-creativity-validation.yml"
      - "configs/external_*creativity*.json"
      - "configs/core_creative_discovery.json"
      - "configs/creative_dataset_challenges.json"
      - "configs/creativity_ablation_protocol.json"
      - "configs/creativity_confirmatory_generation.json"
      - "configs/creativity_tournament_generation.json"
      - "configs/claim_specific_prior_art.json"
      - "configs/claims/**"
      - "configs/declarative_extension_candidates.json"
      - "configs/rotating_external_benchmark_pack*.json"
      - "formal/lean/ExternalKnownFormulaControls.lean"
      - "pyproject.toml"
      - "src/sigma_theory_compiler/claude_creativity_api.py"
      - "src/sigma_theory_compiler/core_*.py"
      - "src/sigma_theory_compiler/creative_expansion.py"
      - "src/sigma_theory_compiler/creativity_ablation.py"
      - "src/sigma_theory_compiler/creativity_confirmatory_*.py"
      - "src/sigma_theory_compiler/creativity_tournament_generation.py"
      - "src/sigma_theory_compiler/durable_llm_attempt_journal.py"
      - "src/sigma_theory_compiler/claim_specific_prior_art.py"
      - "src/sigma_theory_compiler/dataset_challenge_suite.py"
      - "src/sigma_theory_compiler/declarative_discovery_*.py"
      - "src/sigma_theory_compiler/idea_lineage.py"
      - "src/sigma_theory_compiler/rotating_external_benchmarks.py"
      - "src/sigma_theory_compiler/external_creativity_*.py"
      - "src/sigma_theory_compiler/independent_exact_evaluator.py"
      - "tests/test_claude_creativity_api.py"
      - "tests/test_core_*.py"
      - "tests/test_creative_expansion.py"
      - "tests/test_creativity_ablation.py"
      - "tests/test_creativity_confirmatory_generation.py"
      - "tests/test_creativity_tournament_generation.py"
      - "tests/test_durable_llm_attempt_journal.py"
      - "tests/test_claim_specific_prior_art.py"
      - "tests/test_dataset_challenge_suite.py"
      - "tests/test_declarative_discovery_*.py"
      - "tests/test_external_creativity_*.py"
      - "tests/test_independent_exact_evaluator.py"
      - "tests/test_rotating_external_benchmarks.py"
      - "runs/math/claim-specific-prior-art/**"
      - "runs/math/creativity-tournament/**"
      - "runs/math/creativity-confirmatory/**"
      - "runs/math/rotating-external-benchmarks/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/external-creativity-validation.yml"
      - "configs/external_*creativity*.json"
      - "configs/core_creative_discovery.json"
      - "configs/creative_dataset_challenges.json"
      - "configs/creativity_ablation_protocol.json"
      - "configs/creativity_confirmatory_generation.json"
      - "configs/creativity_tournament_generation.json"
      - "configs/claim_specific_prior_art.json"
      - "configs/claims/**"
      - "configs/declarative_extension_candidates.json"
      - "configs/rotating_external_benchmark_pack*.json"
      - "formal/lean/ExternalKnownFormulaControls.lean"
      - "pyproject.toml"
      - "src/sigma_theory_compiler/claude_creativity_api.py"
      - "src/sigma_theory_compiler/core_*.py"
      - "src/sigma_theory_compiler/creative_expansion.py"
      - "src/sigma_theory_compiler/creativity_ablation.py"
      - "src/sigma_theory_compiler/creativity_confirmatory_*.py"
      - "src/sigma_theory_compiler/creativity_tournament_generation.py"
      - "src/sigma_theory_compiler/durable_llm_attempt_journal.py"
      - "src/sigma_theory_compiler/claim_specific_prior_art.py"
      - "src/sigma_theory_compiler/dataset_challenge_suite.py"
      - "src/sigma_theory_compiler/declarative_discovery_*.py"
      - "src/sigma_theory_compiler/idea_lineage.py"
      - "src/sigma_theory_compiler/rotating_external_benchmarks.py"
      - "src/sigma_theory_compiler/external_creativity_*.py"
      - "src/sigma_theory_compiler/independent_exact_evaluator.py"
      - "tests/test_claude_creativity_api.py"
      - "tests/test_core_*.py"
      - "tests/test_creative_expansion.py"
      - "tests/test_creativity_ablation.py"
      - "tests/test_creativity_confirmatory_generation.py"
      - "tests/test_creativity_tournament_generation.py"
      - "tests/test_durable_llm_attempt_journal.py"
      - "tests/test_claim_specific_prior_art.py"
      - "tests/test_dataset_challenge_suite.py"
      - "tests/test_declarative_discovery_*.py"
      - "tests/test_external_creativity_*.py"
      - "tests/test_independent_exact_evaluator.py"
      - "tests/test_rotating_external_benchmarks.py"
      - "runs/math/claim-specific-prior-art/**"
      - "runs/math/creativity-tournament/**"
      - "runs/math/creativity-confirmatory/**"
      - "runs/math/rotating-external-benchmarks/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-reproduction:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --editable ".[dev]"
      - run: >-
          python -m pytest -q
          tests/test_claude_creativity_api.py
          tests/test_independent_exact_evaluator.py
          tests/test_external_creativity_validation.py
          tests/test_external_creativity_lean_bridge.py
          tests/test_external_creativity_live_evidence.py
          tests/test_external_creativity_multi_host.py
          tests/test_core_credential.py
          tests/test_core_creative_discovery.py
          tests/test_creative_expansion.py
          tests/test_creativity_ablation.py
          tests/test_creativity_confirmatory_generation.py
          tests/test_creativity_confirmatory_scoring.py
          tests/test_creativity_tournament_generation.py
          tests/test_durable_llm_attempt_journal.py
          tests/test_claim_specific_prior_art.py
          tests/test_dataset_challenge_suite.py
          tests/test_rotating_external_benchmarks.py
          tests/test_declarative_discovery_runtime.py
          tests/test_declarative_discovery_operational_campaign.py
      - run: >-
          python -m sigma_theory_compiler.claim_specific_prior_art validate
          --root .
          --receipt runs/math/claim-specific-prior-art/live-uncertain-recaman.json
      - run: >-
          python -m sigma_theory_compiler.rotating_external_benchmarks validate
          --root .
          --generation runs/math/rotating-external-benchmarks/2026-08-23-001-generation.json
          --targets runs/math/rotating-external-benchmarks/2026-08-23-001-targets.json
          --receipt runs/math/rotating-external-benchmarks/2026-08-23-001-receipt.json
      - run: >-
          python -m sigma_theory_compiler.creativity_tournament_generation validate
          --root "${{ github.workspace }}"
          --review-packet runs/math/creativity-tournament/paired-review-packet.json
          --receipt runs/math/creativity-tournament/paired-generation-receipt.json
      - run: >-
          python -m sigma_theory_compiler.creativity_confirmatory_generation validate
          --root "${{ github.workspace }}"
          --review-packet runs/math/creativity-confirmatory/paired-review-packet.json
          --receipt runs/math/creativity-confirmatory/paired-generation-receipt.json
      - run: >-
          python -m sigma_theory_compiler.creativity_confirmatory_recovery validate
          --root "${{ github.workspace }}"
          --review-packet runs/math/creativity-confirmatory/paired-review-packet.json
          --receipt runs/math/creativity-confirmatory/paired-generation-receipt.json
      - run: >-
          python -m sigma_theory_compiler.external_creativity_validation
          --output external-creativity-${{ matrix.os }}-${{ matrix.python }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-creativity-${{ matrix.os }}-${{ matrix.python }}
          path: external-creativity-${{ matrix.os }}-${{ matrix.python }}.json

  lean-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
      - run: python -m pip install --editable ".[dev]"
      - run: lean formal/lean/ExternalKnownFormulaControls.lean
      - run: >-
          python -m sigma_theory_compiler.external_creativity_lean_bridge
          --output external-creativity-lean.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-creativity-lean
          path: external-creativity-lean.json
