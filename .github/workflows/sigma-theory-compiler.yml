          src/sigma_theory_compiler/math_benchmark.py
          src/sigma_theory_compiler/math_pack.py
          src/sigma_theory_compiler/math_proof.py
          src/sigma_theory_compiler/math_proof_strategy.py
          src/sigma_theory_compiler/math_benchmark_runner.py
          src/sigma_theory_compiler/math_lean_adapter.py
          src/sigma_theory_compiler/candidate_generator_portfolio.py
          src/sigma_theory_compiler/evolutionary_candidate_generator.py
          src/sigma_theory_compiler/bayesian_candidate_generator.py
          src/sigma_theory_compiler/egraph_candidate_generator.py
          src/sigma_theory_compiler/grammar_candidate_generator.py
          src/sigma_theory_compiler/symbolic_candidate_generator.py
          src/sigma_theory_compiler/cross_domain_candidate_generator.py
          src/sigma_theory_compiler/llm_candidate_generator.py
          src/sigma_theory_compiler/candidate_knowledge_graph.py
          src/sigma_theory_compiler/equation_universe_knowledge_adapter.py
          src/sigma_theory_compiler/candidate_pareto_explanations.py
          src/sigma_theory_compiler/candidate_evaluation_ladder.py
          src/sigma_theory_compiler/candidate_discovery_pipeline.py
          src/sigma_theory_compiler/anonymous_natural_sum_blind_rediscovery.py
          src/sigma_theory_compiler/synthetic_finite_algebra_holdout_world.py
          src/sigma_theory_compiler/synthetic_graph_cut_holdout_world.py
          src/sigma_theory_compiler/synthetic_modular_exponent_holdout_world.py
          src/sigma_theory_compiler/synthetic_affine_geometry_holdout_world.py
          tests/test_sigma_core.py
          tests/test_math_types.py
          tests/test_math_expression_ir.py
          tests/test_math_canonicalizer.py
          tests/test_math_counterexample.py
          tests/test_math_benchmark.py
          tests/test_math_pack.py
          tests/test_math_proof.py
          tests/test_math_proof_strategy.py
          tests/test_math_benchmark_runner.py
          tests/test_math_lean_adapter.py
