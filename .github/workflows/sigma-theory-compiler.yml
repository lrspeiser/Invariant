name: Invariant formula discovery system

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sigma-theory-compiler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sigma-core-math-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Invariant and test tools
        run: python -m pip install --editable ".[dev]"
      - name: Check Sigma Core and Math Pack source
        run: >-
          python -m ruff check
          src/sigma_theory_compiler/sigma_core.py
          src/sigma_theory_compiler/math_types.py
          src/sigma_theory_compiler/math_expression_ir.py
