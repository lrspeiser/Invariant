          src/sigma_theory_compiler/llm_candidate_generator.py
          src/sigma_theory_compiler/candidate_knowledge_graph.py
          src/sigma_theory_compiler/equation_universe_knowledge_adapter.py
          src/sigma_theory_compiler/candidate_pareto_explanations.py
          src/sigma_theory_compiler/candidate_evaluation_ladder.py
          src/sigma_theory_compiler/candidate_discovery_pipeline.py
