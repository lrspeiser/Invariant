name: declarative-discovery

on:
  push:
    paths:
      - ".github/workflows/declarative-discovery.yml"
      - "configs/declarative_discovery_platform.json"
      - "configs/declarative_discovery_receipt_dag.json"
      - "runs/math/declarative-discovery-platform/**"
      - "src/sigma_theory_compiler/declarative_discovery.py"
      - "src/sigma_theory_compiler/declarative_discovery_campaign.py"
      - "src/sigma_theory_compiler/receipt_dag.py"
      - "tests/test_declarative_discovery.py"
      - "tests/test_declarative_discovery_campaign.py"
      - "tests/test_receipt_dag.py"
  pull_request:
    paths:
      - ".github/workflows/declarative-discovery.yml"
      - "configs/declarative_discovery_platform.json"
      - "configs/declarative_discovery_receipt_dag.json"
      - "runs/math/declarative-discovery-platform/**"
      - "src/sigma_theory_compiler/declarative_discovery.py"
      - "src/sigma_theory_compiler/declarative_discovery_campaign.py"
      - "src/sigma_theory_compiler/receipt_dag.py"
      - "tests/test_declarative_discovery.py"
      - "tests/test_declarative_discovery_campaign.py"
      - "tests/test_receipt_dag.py"

permissions:
  contents: read

jobs:
  protocol-and-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest ruff
      - run: python -m ruff check src/sigma_theory_compiler/declarative_discovery.py src/sigma_theory_compiler/declarative_discovery_campaign.py src/sigma_theory_compiler/receipt_dag.py tests/test_declarative_discovery.py tests/test_declarative_discovery_campaign.py tests/test_receipt_dag.py
      - run: python -m pytest -q tests/test_declarative_discovery.py tests/test_declarative_discovery_campaign.py tests/test_receipt_dag.py
      - run: python -m sigma_theory_compiler.declarative_discovery_campaign --check
      - run: python -m sigma_theory_compiler.receipt_dag --manifest configs/declarative_discovery_receipt_dag.json --check
