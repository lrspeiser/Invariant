name: Gravity extension controls
on:
  pull_request:
    paths:
      - 'src/invariant_gravity_extensions/**'
      - 'configs/gravity_extension_discovery_v1.json'
      - 'tests/test_gravity_extensions.py'
      - 'scripts/run_gravity_extensions.py'
      - '.github/workflows/gravity-extensions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-controls:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install only control dependencies
        run: python -m pip install "numpy>=2,<3" "scipy>=1.15,<2" "sympy>=1.13,<2" "pytest>=8.3" "ruff>=0.9"
      - name: Lint new code only
        run: python -m ruff check src/invariant_gravity_extensions tests/test_gravity_extensions.py scripts/run_gravity_extensions.py
      - name: Analytic and adversarial implementation controls
        run: python -m pytest tests/test_gravity_extensions.py -q
      - name: Synthetic campaign (no scientific data or LFS)
        run: python scripts/run_gravity_extensions.py demo --assume-no-slip --output tmp/gravity-extensions-ci
